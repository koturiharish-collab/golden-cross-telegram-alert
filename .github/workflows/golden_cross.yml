name: NSE Fresh Golden Cross Alert

on:
  schedule:
    # 10:15 UTC = 15:45 IST
    - cron: "15 10 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # SETUP PYTHON
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # RUN GOLDEN CROSS SCANNER
      # --------------------------------------------------
      - name: Run Fresh Golden Cross Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python golden_cross.py

      # --------------------------------------------------
      # MAKE SURE STATE FILE EXISTS
      # --------------------------------------------------
      - name: Ensure alert state exists
        run: |
          if [ ! -f alert_state.json ]; then
            echo "{}" > alert_state.json
          fi

      # --------------------------------------------------
      # SAVE ALERT STATE
      # --------------------------------------------------
      - name: Save alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add alert_state.json

          git diff --cached --quiet || git commit -m "Update golden cross alert state"

          git push
