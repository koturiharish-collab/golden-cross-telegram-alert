name: Golden Cross Alert (All NSE stocks)

on:
  schedule:
    # Every 30 min, Mon-Fri, 08:30-16:00 IST (covers NSE hours 09:15-15:30 IST). Cron is UTC.
    - cron: "*/30 3-10 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a Telegram test message only"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: golden-cross
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # MIN_AVG_VOLUME: "50000"   # uncomment to skip illiquid stocks
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python golden_cross_alert.py --test
          else
            python golden_cross_alert.py
          fi

      - name: Save state
        run: |
          git add state.json nse_equities.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "update alert state"
            git pull --rebase -q || true
            git push
          fi
