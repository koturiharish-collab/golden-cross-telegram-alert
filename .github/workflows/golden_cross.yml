name: Golden Cross Alert (All NSE stocks)

on:
  schedule:
    # Every 30 min, Mon-Fri, 08:47-16:17 IST. Cron is UTC. Odd minutes get skipped less.
    - cron: "17,47 3-10 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a Telegram test message only"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: golden-cross
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # MIN_AVG_VOLUME: "50000"   # uncomment to skip illiquid stocks
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python golden_cross_alert.py --test
          else
            python golden_cross_alert.py
          fi

      - name: Save state
        if: always()
        run: |
          git add state.json nse_equities.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "update alert state"
            git pull --rebase -q || true
            git push
          fi

      # ❌ on any failure. ✅ only from the last scheduled run of the day (16:00 IST or later).
      - name: Telegram status
        if: always() && inputs.test != true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          HOUR=$(TZ=Asia/Kolkata date +%H)
          if [ "$JOB_STATUS" != "success" ]; then
            MSG="❌ Golden Cross scan FAILED - check GitHub Actions logs"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$HOUR" -ge 16 ]; then
            MSG="✅ Golden Cross: last scan of the day done ($(TZ=Asia/Kolkata date '+%d %b %H:%M IST'))"
          else
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MSG}" > /dev/null
