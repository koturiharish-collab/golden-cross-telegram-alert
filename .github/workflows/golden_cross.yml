name: Golden Cross Alert

on:
  schedule:
    - cron: "*/30 * * * 1-5"   # every 30 min, Mon-Fri (UTC)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a Telegram test message only"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: golden-cross
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python golden_cross_alert.py --test
          else
            python golden_cross_alert.py
          fi

      - name: Save state (dedupe memory)
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update alert state"
            git push
          fi
